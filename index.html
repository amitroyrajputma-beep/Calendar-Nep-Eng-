<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        /* Style for the date and time box */
        #datetime-box {
            position: absolute;
            top: 20px;    /* Moved to top */
            left: 20px;   /* Kept on the left */
            background-color: rgba(0, 0, 0, 0.7); 
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            text-align: left;
        }
        #datetime-box .nepali-date {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Default image set to 6.jpeg (Kartik) -->
        <img id="calendarImage" src="6.jpeg" alt="Current Month Calendar">
        
        <!-- This is the box that will show the date and time -->
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading Nepali Date...</div>
            <div id="englishDate">Loading English Date...</div>
            <div id="time">Loading Time...</div>
        </div>
    </div>

    <script>
        // --- 1. CALENDAR IMAGE LOGIC (Corrected Mapping) ---
        const today = new Date();
        const month = today.getMonth(); // 0 = Jan, 9 = Oct, etc.
        const year = today.getFullYear(); 

        let imageToShow = "6.jpeg"; // Default fallback

        if (year === 2026) {
            if (month === 3) imageToShow = "2.jpeg";  // April -> Baisakh (Image 2)
            if (month === 4) imageToShow = "3.jpeg";  // May -> Jestha (Image 3)
            if (month === 5) imageToShow = "4.jpeg";  // June -> Ashadh (Image 4)
            if (month === 6) imageToShow = "5.jpeg";  // July -> Shrawan (Image 5)
            if (month === 7) imageToShow = "6.jpeg";  // August -> Bhadra (Image 6)
            if (month === 8) imageToShow = "7.jpeg";  // September -> Ashwin (Image 7)
            if (month === 9) imageToShow = "8.jpeg";  // October -> Kartik (Image 8)
            if (month === 10) imageToShow = "9.jpeg"; // November -> Mangsir (Image 9)
            if (month === 11) imageToShow = "10.jpeg"; // December -> Poush (Image 10)
        } 
        else if (year === 2027) {
            if (month === 0) imageToShow = "11.jpeg"; // January -> Magh (Image 11)
            if (month === 1) imageToShow = "1.jpeg";  // February -> Falgun (Image 1)
            if (month === 2) imageToShow = "12.jpeg"; // March -> Chaitra (Image 12)
        }

        document.getElementById("calendarImage").src = imageToShow;


        // --- 2. LIVE DATE AND TIME LOGIC ---
        
        const nepaliMonths = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDate(date) {
            const y = date.getFullYear();
            const m = date.getMonth();
            const d = date.getDate();

            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            if (y === 2026) {
                if (m === 3) { nepaliMonthIndex = 0; nepaliDay = d - 13; } 
                else if (m === 4) { nepaliMonthIndex = 1; nepaliDay = d - 14; } 
                else if (m === 5) { nepaliMonthIndex = 2; nepaliDay = d - 14; } 
                else if (m === 6) { nepaliMonthIndex = 3; nepaliDay = d - 16; } 
                else if (m === 7) { nepaliMonthIndex = 4; nepaliDay = d - 16; } 
                else if (m === 8) { nepaliMonthIndex = 5; nepaliDay = d - 16; } 
                else if (m === 9) { nepaliMonthIndex = 6; nepaliDay = d - 17; } // October -> Kartik
                else if (m === 10) { nepaliMonthIndex = 7; nepaliDay = d - 16; } 
                else if (m === 11) { nepaliMonthIndex = 8; nepaliDay = d - 16; } 
            } else if (y === 2027) {
                if (m === 0) { nepaliMonthIndex = 9; nepaliDay = d - 14; } 
                else if (m === 1) { nepaliMonthIndex = 10; nepaliDay = d - 12; } 
                else if (m === 2) { nepaliMonthIndex = 11; nepaliDay = d - 14; } 
            }

            if (nepaliDay <= 0) { nepaliDay = 1; } 

            let nepaliDayStr = nepaliDay.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliYear.toString().split('').map(num => nepaliDigits[num]).join('');

            return `${nepaliMonths[nepaliMonthIndex]} ${nepaliDayStr}, ${nepaliYearStr}`;
        }

        function updateClock() {
            const now = new Date();
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            document.getElementById("nepaliDate").innerText = getNepaliDate(now);

            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');
        }

        updateClock();
        setInterval(updateClock, 1000);

    </script>
</body>
</html>
