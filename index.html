<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        /* Style for the date and time box */
        #datetime-box {
            position: absolute;
            top: 20px;    /* Top Left Corner */
            left: 20px;   
            background-color: rgba(0, 0, 0, 0.75); 
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #datetime-box .nepali-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700; /* Gold color for Nepali date */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- The source will be updated by JavaScript -->
        <img id="calendarImage" src="Kartik.jpeg" alt="Current Month Calendar">
        
        <!-- This is the box that will show the date and time -->
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading Nepali Date...</div>
            <div id="englishDate">Loading English Date...</div>
            <div id="time">Loading Time...</div>
        </div>
    </div>

    <script>
        // --- 1. NEPALI DATE CALCULATION ---
        const nepaliMonths = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDateInfo(date) {
            const y = date.getFullYear();
            const m = date.getMonth(); // 0 = Jan, 9 = Oct, etc.
            const d = date.getDate();

            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            // Exact mapping based on the start dates in your calendar images
            if (y === 2026) {
                if (m === 9) { nepaliMonthIndex = 6; nepaliDay = d + 17; } // Oct -> Kartik (Starts Oct 18)
                else if (m === 10) { nepaliMonthIndex = 7; nepaliDay = d + 16; } // Nov -> Mangsir (Starts Nov 17)
                else if (m === 11) { nepaliMonthIndex = 8; nepaliDay = d + 15; } // Dec -> Poush (Starts Dec 16)
            } else if (y === 2027) {
                if (m === 0) { nepaliMonthIndex = 9; nepaliDay = d + 16; } // Jan -> Magh (Starts Jan 17)
                else if (m === 1) { nepaliMonthIndex = 10; nepaliDay = d + 13; } // Feb -> Falgun (Starts Feb 14)
                else if (m === 2) { nepaliMonthIndex = 11; nepaliDay = d + 14; } // Mar -> Chaitra (Starts Mar 15)
            }

            // Handle end of Nepali month rollover
            if (nepaliDay > 32) { 
                nepaliDay -= 32; 
                nepaliMonthIndex++; 
                if (nepaliMonthIndex > 11) { nepaliMonthIndex = 0; nepaliYear++; }
            } 

            return {
                monthName: nepaliMonths[nepaliMonthIndex],
                day: nepaliDay,
                year: nepaliYear
            };
        }

        // --- 2. LIVE CLOCK AND IMAGE UPDATER ---
        function updateCalendar() {
            const now = new Date();
            
            // Get accurate Nepali info
            const nepaliInfo = getNepaliDateInfo(now);

            // 1. UPDATE DATE AND TIME TEXT
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            // Convert numbers to Nepali digits
            let nepaliDayStr = nepaliInfo.day.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliInfo.year.toString().split('').map(num => nepaliDigits[num]).join('');
            
            document.getElementById("nepaliDate").innerText = `${nepaliInfo.monthName} ${nepaliDayStr}, ${nepaliYearStr}`;
            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');

            // 2. UPDATE IMAGE BASED ON THE NEPALI MONTH NAME
            // (Make sure your files on GitHub are renamed exactly like this)
            const newImageSrc = `${nepaliInfo.monthName}.jpeg`; 
            const imgElement = document.getElementById("calendarImage");
            
            // Only change the image source if it's different (prevents flickering)
            if (!imgElement.src.includes(newImageSrc)) {
                imgElement.src = newImageSrc;
            }
        }

        // Run immediately and update every second
        updateCalendar();
        setInterval(updateCalendar, 1000);

    </script>
</body>
</html>
