<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clock & Watch</title>
    <style>
        html, body { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden; 
            background-color: #121212; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff;
        }
        body {
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 50px; /* Space between the text and the watch */
        }
        
        /* --- DIGITAL DATE AND TIME BOX --- */
        #datetime-box {
            background-color: rgba(30, 30, 30, 0.95); 
            color: #ffffff; 
            padding: 30px 40px; 
            border-radius: 20px; 
            font-size: 28px; 
            line-height: 1.6; 
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8); 
            border: 1px solid #333;
            box-sizing: border-box;
            min-width: 350px;
        }
        
        #datetime-box .nepali-date {
            font-size: 42px; 
            font-weight: bold; 
            color: #ffd700; /* Gold */
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        #datetime-box .english-date {
            font-size: 22px;
            color: #cccccc;
            margin-bottom: 10px;
        }

        #datetime-box .time-text {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* --- ANALOG WATCH STYLING --- */
        .analog-clock {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a2a, #0a0a0a);
            border: 8px solid #ffd700; /* Gold border */
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 30px rgba(0,0,0,0.9);
            position: relative;
        }
        
        /* The center dot */
        .analog-clock::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            background: #ffd700;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Number markings */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transform: rotate(var(--rotation));
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
        }
        .number span {
            display: inline-block;
            transform: rotate(calc(-1 * var(--rotation)));
            padding-top: 15px;
        }

        /* Clock Hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 5;
        }
        
        .hour-hand {
            width: 8px;
            height: 85px;
            background-color: #ffffff;
            margin-left: -4px;
        }
        
        .minute-hand {
            width: 5px;
            height: 120px;
            background-color: #ffffff;
            margin-left: -2.5px;
        }
        
        .second-hand {
            width: 3px;
            height: 135px;
            background-color: #ffd700; /* Gold second hand */
            margin-left: -1.5px;
        }

        /* --- AUDIO BUTTON --- */
        #audio-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background-color: #ffd700; 
            color: #000; 
            border: none; 
            padding: 12px 25px;
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); 
            transition: background 0.3s, transform 0.2s;
        }
        #audio-btn:hover { background-color: #ffed4a; transform: scale(1.05); }

        /* Mobile responsiveness */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
                gap: 30px;
            }
            .analog-clock {
                width: 220px;
                height: 220px;
            }
            #datetime-box {
                padding: 20px;
                min-width: 250px;
            }
            #datetime-box .nepali-date { font-size: 32px; }
            #datetime-box .time-text { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE: Digital Date and Time -->
    <div id="datetime-box">
        <div class="nepali-date" id="nepaliDate">Loading...</div>
        <div class="english-date" id="englishDate">Loading...</div>
        <div class="time-text" id="time">Loading...</div>
    </div>

    <!-- RIGHT SIDE: Analog Watch -->
    <div class="analog-clock" id="analogClock">
        <!-- Numbers 1 to 12 -->
        <div class="number" style="--rotation: 30deg;"><span>1</span></div>
        <div class="number" style="--rotation: 60deg;"><span>2</span></div>
        <div class="number" style="--rotation: 90deg;"><span>3</span></div>
        <div class="number" style="--rotation: 120deg;"><span>4</span></div>
        <div class="number" style="--rotation: 150deg;"><span>5</span></div>
        <div class="number" style="--rotation: 180deg;"><span>6</span></div>
        <div class="number" style="--rotation: 210deg;"><span>7</span></div>
        <div class="number" style="--rotation: 240deg;"><span>8</span></div>
        <div class="number" style="--rotation: 270deg;"><span>9</span></div>
        <div class="number" style="--rotation: 300deg;"><span>10</span></div>
        <div class="number" style="--rotation: 330deg;"><span>11</span></div>
        <div class="number" style="--rotation: 0deg;"><span>12</span></div>
        
        <!-- Hands -->
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
    </div>

    <!-- Voice Enable Button -->
    <button id="audio-btn" onclick="startAudio()">🔊 Enable Voice Time</button>

    <script>
        // --- 0. AUDIO VOICE LOGIC ---
        let audioEnabled = false;

        function startAudio() {
            if ('speechSynthesis' in window) {
                // Wake up the audio engine
                const silent = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silent);
                audioEnabled = true;
                document.getElementById("audio-btn").style.display = "none"; 
                
                // Announce immediately that it is working
                setTimeout(() => { speakTime(new Date()); }, 500);
            } else {
                alert("Your browser does not support speech synthesis.");
            }
        }

        function speakTime(date) {
            if ('speechSynthesis' in window) {
                const timeString = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true });
                const utterance = new SpeechSynthesisUtterance(`The time is ${timeString}`);
                utterance.rate = 0.9; 
                utterance.pitch = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 1. ACCURATE NEPALI DATE DATA ---
        const nepaliYearData = {
            2083: [
                { name: "Baisakh", start: "2026-04-14", end: "2026-05-14" },
                { name: "Jestha",  start: "2026-05-15", end: "2026-06-14" },
                { name: "Ashadh",  start: "2026-06-15", end: "2026-07-16" },
                { name: "Shrawan", start: "2026-07-17", end: "2026-08-16" },
                { name: "Bhadra",  start: "2026-08-17", end: "2026-09-16" },
                { name: "Ashwin",  start: "2026-09-17", end: "2026-10-17" },
                { name: "Kartik",  start: "2026-10-18", end: "2026-11-16" },
                { name: "Mangsir", start: "2026-11-17", end: "2026-12-16" },
                { name: "Poush",   start: "2026-12-17", end: "2027-01-16" },
                { name: "Magh",    start: "2027-01-17", end: "2027-02-13" },
                { name: "Falgun",  start: "2027-02-14", end: "2027-03-14" },
                { name: "Chaitra", start: "2027-03-15", end: "2027-04-13" }
            ]
        };
        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];
        
        function getNepaliDateInfo(date) {
            const currentDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            let nepaliYear = 2083, nepaliMonthIndex = 0, nepaliDay = 1;
            for (let i = 0; i < nepaliYearData[2083].length; i++) {
                const monthData = nepaliYearData[2083][i];
                const startDate = new Date(monthData.start);
                const endDate = new Date(monthData.end);
                if (currentDate >= startDate && currentDate <= endDate) {
                    nepaliMonthIndex = i;
                    const diffTime = currentDate - startDate;
                    nepaliDay = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1; 
                    break;
                }
            }
            return { monthName: nepaliYearData[2083][nepaliMonthIndex].name, day: nepaliDay, year: nepaliYear };
        }

        let lastSpokenMinute = -1; 

        // --- 2. THE CLOCK UPDATER ---
        function updateEverything() {
            const now = new Date();
            const nepaliInfo = getNepaliDateInfo(now);
            const currentMinute = now.getMinutes(), currentSecond = now.getSeconds();
            
            // 1. Update Digital Text
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);
            
            let nepaliDayStr = nepaliInfo.day.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliInfo.year.toString().split('').map(num => nepaliDigits[num]).join('');
            document.getElementById("nepaliDate").innerText = `${nepaliInfo.monthName} ${nepaliDayStr}, ${nepaliYearStr}`;
            
            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');

            // 2. Update Analog Clock Hands
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = ((minutes / 60) * 360) + ((seconds / 60) * 6);
            const hourDegrees = ((hours % 12) / 12) * 360 + ((minutes / 60) * 30);

            document.getElementById("secondHand").style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById("minuteHand").style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById("hourHand").style.transform = `rotate(${hourDegrees}deg)`;

            // 3. Voice Announcement
            if (audioEnabled && currentSecond === 0 && currentMinute !== lastSpokenMinute) {
                lastSpokenMinute = currentMinute;
                speakTime(now);
            }
        }

        // Run the updater every second
        window.onload = function() {
            updateEverything(); 
            setInterval(updateEverything, 1000); 
        };
    </script>
</body>
</html>
