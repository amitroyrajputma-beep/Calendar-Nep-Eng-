<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            font-family: Arial, sans-serif;
            gap: 20px;
        }

        /* --- Left Side (Clock & Random Images) --- */
        #left-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 220px;
            flex-shrink: 0;
        }

        #datetime-box {
            background-color: rgba(0, 0, 0, 0.85); 
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            width: 100%;
            box-sizing: border-box;
        }
        #datetime-box .nepali-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Random Sliding Images */
        .side-image, .side-image-right {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 1s ease-out;
            /* This hides the text if the image is missing */
            color: transparent; 
            font-size: 0;
            min-height: 150px; /* Keeps the space open while loading */
            background-color: #ddd;
        }

        /* --- Middle (Calendar) --- */
        .container {
            position: relative;
            width: 100%;
            max-width: 650px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: white;
            flex-shrink: 0;
        }
        .container img { 
            width: 100%; 
            height: auto; 
            display: block;
        }

        /* --- Right Side --- */
        #right-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 220px;
            flex-shrink: 0;
        }

        /* --- Animations --- */
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1100px) {
            #left-sidebar, #right-sidebar { display: none; }
            body { padding: 0; }
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div id="left-sidebar">
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading...</div>
            <div id="englishDate">Loading...</div>
            <div id="time">Loading...</div>
        </div>
        <img id="leftImg1" class="side-image" src="god1.jpg" alt="">
        <img id="leftImg2" class="side-image" src="god2.jpg" alt="">
        <img id="leftImg3" class="side-image" src="god3.jpg" alt="">
    </div>

    <!-- CALENDAR -->
    <div class="container">
        <img id="calendarImage" src="Ashwin.jpeg" alt="Current Month Calendar">
    </div>

    <!-- RIGHT SIDEBAR -->
    <div id="right-sidebar">
        <img id="rightImg1" class="side-image-right" src="god4.jpg" alt="">
        <img id="rightImg2" class="side-image-right" src="god5.jpg" alt="">
        <img id="rightImg3" class="side-image-right" src="god6.jpg" alt="">
    </div>

    <script>
        // --- 1. ACCURATE NEPALI DATE DATA ---
        const nepaliYearData = {
            2083: [
                { name: "Baisakh", start: "2026-04-14", end: "2026-05-14" },
                { name: "Jestha",  start: "2026-05-15", end: "2026-06-14" },
                { name: "Ashadh",  start: "2026-06-15", end: "2026-07-16" },
                { name: "Shrawan", start: "2026-07-17", end: "2026-08-16" },
                { name: "Bhadra",  start: "2026-08-17", end: "2026-09-16" },
                { name: "Ashwin",  start: "2026-09-17", end: "2026-10-17" },
                { name: "Kartik",  start: "2026-10-18", end: "2026-11-16" },
                { name: "Mangsir", start: "2026-11-17", end: "2026-12-16" },
                { name: "Poush",   start: "2026-12-17", end: "2027-01-16" },
                { name: "Magh",    start: "2027-01-17", end: "2027-02-13" },
                { name: "Falgun",  start: "2027-02-14", end: "2027-03-14" },
                { name: "Chaitra", start: "2027-03-15", end: "2027-04-13" }
            ]
        };

        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDateInfo(date) {
            const currentDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            for (let i = 0; i < nepaliYearData[2083].length; i++) {
                const monthData = nepaliYearData[2083][i];
                const startDate = new Date(monthData.start);
                const endDate = new Date(monthData.end);

                if (currentDate >= startDate && currentDate <= endDate) {
                    nepaliMonthIndex = i;
                    const diffTime = currentDate - startDate;
                    const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                    nepaliDay = diffDays + 1; 
                    break;
                }
            }
            return {
                monthName: nepaliYearData[2083][nepaliMonthIndex].name,
                day: nepaliDay,
                year: nepaliYear
            };
        }

        function updateCalendar() {
            const now = new Date();
            const nepaliInfo = getNepaliDateInfo(now);

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            let nepaliDayStr = nepaliInfo.day.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliInfo.year.toString().split('').map(num => nepaliDigits[num]).join('');
            document.getElementById("nepaliDate").innerText = `${nepaliInfo.monthName} ${nepaliDayStr}, ${nepaliYearStr}`;

            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');

            const newImageSrc = `${nepaliInfo.monthName}.jpeg`; 
            const imgElement = document.getElementById("calendarImage");
            if (!imgElement.src.includes(newImageSrc)) {
                imgElement.src = newImageSrc;
            }
        }

        // --- 2. RANDOM SLIDING IMAGES ---
        function loadRandomImages() {
            // Check all possible variations of names (.jpg, .jpeg, .png)
            // You can add more names here if you have more images on GitHub
            const godImages = [
                "god1.jpg", "god2.jpg", "god3.jpg", "god4.jpg", "god5.jpg", "god6.jpg",
                "god7.jpg", "god8.jpg", "god9.jpg", "god10.jpg", "god11.jpg", "god12.jpg",
                "god13.jpg", "god14.jpg", "god15.jpg", "god16.jpg", "god17.jpg", "god18.jpg"
            ];

            // Fallback image from the internet (in case your local files are missing)
            const fallbackImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Lord_Ganesha.jpg/400px-Lord_Ganesha.jpg";

            const getRandomImage = () => {
                const randomImg = godImages[Math.floor(Math.random() * godImages.length)];
                return randomImg;
            };

            // Set images
            const img1 = document.getElementById("leftImg1");
            const img2 = document.getElementById("leftImg2");
            const img3 = document.getElementById("leftImg3");
            const img4 = document.getElementById("rightImg1");
            const img5 = document.getElementById("rightImg2");
            const img6 = document.getElementById("rightImg3");

            // Apply random images. If the file isn't found, the browser will show the fallback.
            // (Note: We add a small onerror function so if the local file is missing, it shows a nice default)
            const applyImage = (element) => {
                element.src = getRandomImage();
                element.onerror = function() {
                    this.onerror = null; // Prevent infinite loop
                    this.src = fallbackImage; // Load fallback image
                };
            };

            applyImage(img1);
            applyImage(img2);
            applyImage(img3);
            applyImage(img4);
            applyImage(img5);
            applyImage(img6);
        }

        window.onload = function() {
            updateCalendar(); 
            setInterval(updateCalendar, 1000); 
            loadRandomImages(); 
        };
    </script>
</body>
</html>
