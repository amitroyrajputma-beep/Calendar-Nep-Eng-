<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        /* Style for the date and time box */
        #datetime-box {
            position: absolute;
            top: 20px;    
            left: 20px;   
            background-color: rgba(0, 0, 0, 0.75); 
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #datetime-box .nepali-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700; /* Gold color for Nepali date */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Default image set to Poush -->
        <img id="calendarImage" src="Poush.jpeg" alt="Current Month Calendar">
        
        <!-- This is the box that will show the date and time -->
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading Nepali Date...</div>
            <div id="englishDate">Loading English Date...</div>
            <div id="time">Loading Time...</div>
        </div>
    </div>

    <script>
        // --- 1. CALENDAR IMAGE LOGIC ---
        const today = new Date();
        const month = today.getMonth(); // 0 = Jan, 9 = Oct, etc.
        const year = today.getFullYear(); 

        // This map links the English month to the new renamed image files
        const imageMap2026 = {
            3: "Baisakh.jpeg",  // April
            4: "Jestha.jpeg",   // May
            5: "Ashadh.jpeg",   // June
            6: "Shrawan.jpeg",  // July
            7: "Bhadra.jpeg",   // August
            8: "Ashwin.jpeg",   // September
            9: "Kartik.jpeg",   // October
            10: "Mangsir.jpeg", // November
            11: "Poush.jpeg"    // December
        };

        const imageMap2027 = {
            0: "Magh.jpeg",     // January
            1: "Falgun.jpeg",   // February
            2: "Chaitra.jpeg"   // March
        };

        let imageToShow = "Poush.jpeg"; // Default

        if (year === 2026 && imageMap2026[month]) {
            imageToShow = imageMap2026[month];
        } else if (year === 2027 && imageMap2027[month]) {
            imageToShow = imageMap2027[month];
        }

        document.getElementById("calendarImage").src = imageToShow;


        // --- 2. LIVE DATE AND TIME LOGIC ---
        
        const nepaliMonths = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDate(date) {
            const y = date.getFullYear();
            const m = date.getMonth();
            const d = date.getDate();

            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            // Based exactly on the start dates in your calendar images!
            if (y === 2026) {
                if (m === 9) { nepaliMonthIndex = 6; nepaliDay = d + 15; } // Oct -> Kartik (Starts Oct 16)
                else if (m === 10) { nepaliMonthIndex = 7; nepaliDay = d + 16; } // Nov -> Mangsir (Starts Nov 17)
                else if (m === 11) { nepaliMonthIndex = 8; nepaliDay = d + 15; } // Dec -> Poush (Starts Dec 16)
            } else if (y === 2027) {
                if (m === 0) { nepaliMonthIndex = 9; nepaliDay = d + 16; } // Jan -> Magh (Starts Jan 17)
                else if (m === 1) { nepaliMonthIndex = 10; nepaliDay = d + 13; } // Feb -> Falgun (Starts Feb 14)
                else if (m === 2) { nepaliMonthIndex = 11; nepaliDay = d + 14; } // Mar -> Chaitra (Starts Mar 15)
            }

            // Handle rollovers 
            if (nepaliDay > 31) { nepaliDay -= 31; } 

            let nepaliDayStr = nepaliDay.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliYear.toString().split('').map(num => nepaliDigits[num]).join('');

            return `${nepaliMonths[nepaliMonthIndex]} ${nepaliDayStr}, ${nepaliYearStr}`;
        }

        function updateClock() {
            const now = new Date();
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            document.getElementById("nepaliDate").innerText = getNepaliDate(now);
            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');
        }

        updateClock();
        setInterval(updateClock, 1000);

    </script>
</body>
</html>
