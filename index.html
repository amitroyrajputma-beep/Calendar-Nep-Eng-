<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        /* Style for the date and time box */
        #datetime-box {
            position: absolute;
            top: 20px;    
            left: 20px;   
            background-color: rgba(0, 0, 0, 0.75); 
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #datetime-box .nepali-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700; /* Gold color for Nepali date */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Default image set to 11.jpeg (Magh) -->
        <img id="calendarImage" src="11.jpeg" alt="Current Month Calendar">
        
        <!-- This is the box that will show the date and time -->
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading Nepali Date...</div>
            <div id="englishDate">Loading English Date...</div>
            <div id="time">Loading Time...</div>
        </div>
    </div>

    <script>
        // --- 1. CALENDAR IMAGE LOGIC (Matching your exact files) ---
        const today = new Date();
        const month = today.getMonth(); // 0 = Jan, 9 = Oct, etc.
        const year = today.getFullYear(); 

        // Map the English months directly to the file names based on your screenshots
        const imageMap2026 = {
            3: "2.jpeg",  // April -> Baisakh
            4: "3.jpeg",  // May -> Jestha
            5: "4.jpeg",  // June -> Ashadh
            6: "5.jpeg",  // July -> Shrawan
            7: "7.jpeg",  // August -> Bhadra
            8: "8.jpeg",  // September -> Ashwin
            9: "9.jpeg",  // October -> Kartik
            10: "6.jpeg", // November -> Mangsir (Based on your last screenshot)
            11: "10.jpeg" // December -> Poush
        };

        const imageMap2027 = {
            0: "11.jpeg", // January -> Magh (Based on your screenshot)
            1: "1.jpeg",  // February -> Falgun
            2: "12.jpeg"  // March -> Chaitra
        };

        let imageToShow = "11.jpeg"; // Default

        if (year === 2026 && imageMap2026[month]) {
            imageToShow = imageMap2026[month];
        } else if (year === 2027 && imageMap2027[month]) {
            imageToShow = imageMap2027[month];
        }

        document.getElementById("calendarImage").src = imageToShow;


        // --- 2. LIVE DATE AND TIME LOGIC ---
        
        // Nepali month names mapping
        const nepaliMonths = ["Baisakh", "Jestha", "Ashadh", "Shrawan", "Bhadra", "Ashwin", "Kartik", "Mangsir", "Poush", "Magh", "Falgun", "Chaitra"];
        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDate(date) {
            const y = date.getFullYear();
            const m = date.getMonth();
            const d = date.getDate();

            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            // Based on the dates in your calendar images
            if (y === 2026) {
                if (m === 9) { // October -> Kartik
                    nepaliMonthIndex = 6; // Kartik
                    nepaliDay = d + 14; 
                }
                else if (m === 10) { // November -> Mangsir
                    nepaliMonthIndex = 7; // Mangsir
                    nepaliDay = d + 16; 
                }
                else if (m === 11) { // December -> Poush
                    nepaliMonthIndex = 8; // Poush
                    nepaliDay = d + 16; 
                }
            } else if (y === 2027) {
                if (m === 0) { // January -> Magh
                    nepaliMonthIndex = 9; // Magh
                    nepaliDay = d + 16; 
                }
                else if (m === 1) { // February -> Falgun
                    nepaliMonthIndex = 10; // Falgun
                    nepaliDay = d + 17; 
                }
                else if (m === 2) { // March -> Chaitra
                    nepaliMonthIndex = 11; // Chaitra
                    nepaliDay = d + 15; 
                }
            }

            // Handle rollovers (if the day goes past the month end)
            if (nepaliDay > 32) { nepaliDay -= 32; } 

            // Convert numbers to Nepali digits
            let nepaliDayStr = nepaliDay.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliYear.toString().split('').map(num => nepaliDigits[num]).join('');

            return `${nepaliMonths[nepaliMonthIndex]} ${nepaliDayStr}, ${nepaliYearStr}`;
        }

        function updateClock() {
            const now = new Date();
            
            // English Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            // Nepali Date
            document.getElementById("nepaliDate").innerText = getNepaliDate(now);

            // Time
            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');
        }

        // Run immediately and update every second
        updateClock();
        setInterval(updateClock, 1000);

    </script>
</body>
</html>
