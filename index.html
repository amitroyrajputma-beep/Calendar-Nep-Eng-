<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nepali Calendar</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img { 
            width: 100%; 
            height: auto; 
            display: block;
        }
        /* Style for the date and time box */
        #datetime-box {
            position: absolute;
            top: 20px;    
            left: 20px;   
            background-color: rgba(0, 0, 0, 0.75); 
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.6;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #datetime-box .nepali-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700; /* Gold color for Nepali date */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- The source will be updated by JavaScript -->
        <img id="calendarImage" src="Ashwin.jpeg" alt="Current Month Calendar">
        
        <!-- This is the box that will show the date and time -->
        <div id="datetime-box">
            <div class="nepali-date" id="nepaliDate">Loading Nepali Date...</div>
            <div id="englishDate">Loading English Date...</div>
            <div id="time">Loading Time...</div>
        </div>
    </div>

    <script>
        // --- 1. ACCURATE NEPALI DATE DATA (2083 BS) ---
        // This tells the code EXACTLY when every Nepali month starts and ends.
        // Based on your calendar images.
        const nepaliYearData = {
            2083: [
                { name: "Baisakh", start: "2026-04-14", end: "2026-05-14" },
                { name: "Jestha",  start: "2026-05-15", end: "2026-06-14" },
                { name: "Ashadh",  start: "2026-06-15", end: "2026-07-16" },
                { name: "Shrawan", start: "2026-07-17", end: "2026-08-16" },
                { name: "Bhadra",  start: "2026-08-17", end: "2026-09-16" },
                { name: "Ashwin",  start: "2026-09-17", end: "2026-10-17" }, // <-- Today (Oct 1) falls here!
                { name: "Kartik",  start: "2026-10-18", end: "2026-11-16" },
                { name: "Mangsir", start: "2026-11-17", end: "2026-12-16" },
                { name: "Poush",   start: "2026-12-17", end: "2027-01-16" },
                { name: "Magh",    start: "2027-01-17", end: "2027-02-13" },
                { name: "Falgun",  start: "2027-02-14", end: "2027-03-14" },
                { name: "Chaitra", start: "2027-03-15", end: "2027-04-13" }
            ]
        };

        const nepaliDigits = ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"];

        function getNepaliDateInfo(date) {
            const y = date.getFullYear();
            const m = date.getMonth();
            const d = date.getDate();
            const currentDate = new Date(y, m, d); // Remove time for accurate comparison

            let nepaliYear = 2083;
            let nepaliMonthIndex = 0;
            let nepaliDay = 1;

            // Loop through the data to find which month today falls into
            for (let i = 0; i < nepaliYearData[2083].length; i++) {
                const monthData = nepaliYearData[2083][i];
                const startDate = new Date(monthData.start);
                const endDate = new Date(monthData.end);

                if (currentDate >= startDate && currentDate <= endDate) {
                    nepaliMonthIndex = i;
                    
                    // Calculate the Nepali day by finding the difference in days
                    const diffTime = Math.abs(currentDate - startDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    nepaliDay = diffDays + 1; // +1 because start date is Day 1
                    break;
                }
            }

            return {
                monthName: nepaliYearData[2083][nepaliMonthIndex].name,
                day: nepaliDay,
                year: nepaliYear
            };
        }

        // --- 2. LIVE CLOCK AND IMAGE UPDATER ---
        function updateCalendar() {
            const now = new Date();
            
            // Get accurate Nepali info
            const nepaliInfo = getNepaliDateInfo(now);

            // 1. UPDATE DATE AND TIME TEXT
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById("englishDate").innerText = now.toLocaleDateString('en-US', options);

            // Convert numbers to Nepali digits
            let nepaliDayStr = nepaliInfo.day.toString().split('').map(num => nepaliDigits[num]).join('');
            let nepaliYearStr = nepaliInfo.year.toString().split('').map(num => nepaliDigits[num]).join('');
            
            document.getElementById("nepaliDate").innerText = `${nepaliInfo.monthName} ${nepaliDayStr}, ${nepaliYearStr}`;
            document.getElementById("time").innerText = now.toLocaleTimeString('en-US');

            // 2. UPDATE IMAGE BASED ON THE EXACT NEPALI MONTH
            const newImageSrc = `${nepaliInfo.monthName}.jpeg`; 
            const imgElement = document.getElementById("calendarImage");
            
            // Change image if it's different
            if (!imgElement.src.includes(newImageSrc)) {
                imgElement.src = newImageSrc;
            }
        }

        // Run immediately and update every second
        updateCalendar();
        setInterval(updateCalendar, 1000);

    </script>
</body>
</html>
